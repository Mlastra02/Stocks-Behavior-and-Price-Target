services:
  postgres:
    image: postgres:16-alpine
    container_name: stocks_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocks_user
      POSTGRES_PASSWORD: stocks_pass
      POSTGRES_DB: stocks_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
